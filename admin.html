<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>لوحة التحكم</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="admin-container">
    <h1>لوحة تحكم المضيف</h1>
    
    <div class="admin-header">
      <p>مرحباً بك في لوحة التحكم الخاصة بمدير النظام.</p>
      <p id="admin-name"></p>
    </div>
    
    <div class="admin-actions">
      <button class="btn manage-btn">إدارة المستخدمين</button>
      <button class="btn stats-btn">إحصائيات المحادثات</button>
      <button class="btn settings-btn">الإعدادات</button>
      <button class="btn logout-btn">تسجيل الخروج</button>
    </div>
    
    <div class="admin-content">
      <!-- هنا سيتم عرض محتوى الإدارة بشكل ديناميكي -->
    </div>
    
    <div class="admin-footer">
      <a href="index.html" class="btn back-btn">العودة للصفحة الرئيسية</a>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    // عرض اسم المدير المسجل الدخول
    document.addEventListener('DOMContentLoaded', function() {
      const currentUser = getCurrentUser();
      if (currentUser) {
        document.getElementById('admin-name').textContent = 
          `مرحباً، ${currentUser.fullname}`;
      }
    });
  </script>
</body>
</html>
